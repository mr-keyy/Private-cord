
name: Build Nextor Cord APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NextorCord-Android-Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q NextorCord-Android-Project.zip -d project

      - name: Build debug APK
        run: |
          gradle -p project/NextorCord --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NextorCord-APK
          path: project/NextorCord/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
